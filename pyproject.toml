[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ericktzinc-alignrsr_jd277"
version = "0.1.0"
description = "解析时间标记，排列对齐算法研究员·张量并行切分策略的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ericktzinc" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ericktzinc.github.io"
Repository = "https://github.com/ericktzinc/alignrsr_jd277"
Issues = "https://github.com/ericktzinc/alignrsr_jd277/issues"

[project.scripts]
alignrsr_jd277 = "alignrsr_jd277:main"

[tool.setuptools]
py-modules = ["alignrsr_jd277"]
